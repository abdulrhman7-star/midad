<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الصفحة غير موجودة — مِداد | Midad</title>
  <meta name="robots" content="noindex">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:'Cairo',system-ui,sans-serif;
      background:linear-gradient(135deg,#f6f7f9 0%,#fee2e2 100%);
      min-height:100vh;display:grid;place-items:center;
      padding:20px;color:#0f172a;
    }
    .card{
      max-width:520px;width:100%;background:#fff;border-radius:24px;
      padding:48px 32px;text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,.08);
    }
    .code{
      font-size:96px;font-weight:900;color:#E5484D;
      line-height:1;margin-bottom:16px;
      background:linear-gradient(135deg,#E5484D,#b91c1c);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    }
    h1{font-size:24px;font-weight:800;margin-bottom:10px}
    p{color:#64748b;line-height:1.7;margin-bottom:28px}
    .btn{
      display:inline-flex;align-items:center;gap:8px;
      padding:14px 28px;border-radius:14px;
      background:#E5484D;color:#fff;font-weight:800;font-size:15px;
      text-decoration:none;border:0;cursor:pointer;
      box-shadow:0 8px 22px rgba(229,72,77,.3);
      transition:.2s;width:100%;justify-content:center;
    }
    .btn:hover{background:#b91c1c;transform:translateY(-2px)}
    .brand{font-family:'Amiri',serif;color:#E5484D;font-weight:700}
  </style>
</head>
<body>
  <div class="card">
    <div class="code">404</div>
    <h1>الصفحة غير موجودة</h1>
    <p>عذراً، الصفحة التي تبحث عنها غير متوفرة.<br>تأكد من الرابط أو عد إلى الصفحة الرئيسية.</p>
    <a href="/" class="btn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      العودة إلى <span class="brand">مِداد</span>
    </a>
  </div>
</body>
</html>
